name: matrix
on: push
jobs:
  
  test:
    continue-on-error: true
    strategy:
      max-parallel: 2
      matrix:
        os: [ubuntu-latest , windows-latest]
        node: [20,22]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
           node-version: '${{matrix.node}}'
      - uses: actions/checkout@v6
        id: cache
        with:
          path: node_modules
          key: deps-node-modules-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm run build 
      - run: ls 
